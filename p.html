<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Sweb pack</title><meta name="description" content="Preview this Sweb pack and add it to your start page in one tap.">
<link rel="stylesheet" href="sweb.css"></head>
<body><main><nav><a href="index.html">Sweb</a><a href="packs.html">Packs</a><a href="privacy.html">Privacy</a></nav>
<div id="pack"><p class="muted">Loading…</p></div>
<a class="btn" id="open" href="#">Add to Sweb</a><a class="btn alt" id="get" href="#">Get Sweb for iPhone</a>
<p class="muted">Adding a pack copies its sites to your start page. You can follow it to see the creator's changes and choose what to accept; your own sites are never touched.</p>
</main>
<script src="sweb.js"></script>
<script>
var id=new URLSearchParams(location.search).get('id')||'';
if(!/^[A-Za-z0-9_-]{8,64}$/.test(id))id='';
document.getElementById('get').href=APP_STORE;
document.getElementById('open').onclick=function(e){e.preventDefault();if(id)openApp('share?i='+id);};
var el=document.getElementById('pack');
if(!id){el.innerHTML='<h1>Pack not found</h1>';}
else api('/v1/setups/'+id).then(function(s){
  var m=s.meta||{},title=m.title||s.snapshot.name||'A Sweb pack';
  document.title=title+' · Sweb pack';
  el.innerHTML='<h1>'+esc(title)+'</h1>'+(m.description?'<p>'+esc(m.description)+'</p>':'')+'<p class="muted">'+s.snapshot.sites.length+' sites'+(s.followers!=null?' · '+s.followers+' following':'')+'</p><div class="card">'+preview(s.snapshot)+'</div>';
}).catch(function(e){el.innerHTML=String(e.message)==='410'||String(e.message)==='404'?'<h1>This pack was removed</h1>':'<h1>A Sweb pack</h1><p class="muted">The preview is not reachable right now. You can still open it in Sweb.</p>';});
</script></body></html>
