<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweb packs: ready-made start pages people keep up to date</title>
<meta name="description" content="Browse Sweb packs: start pages for a job, like morning news, recipes or school parents. Preview every site, add it in one tap, and follow it for updates.">
<link rel="stylesheet" href="sweb.css"></head>
<body><main><nav><a href="index.html">Sweb</a><a href="packs.html">Packs</a><a href="privacy.html">Privacy</a></nav>
<h1>Packs</h1><p class="muted">Start pages people made for a job and keep up to date. Open one to see every site before you add it.</p>
<p class="muted">Want a single folder instead? See <a href="folders.html">ready-made folders</a>.</p>
<input id="q" type="search" placeholder="Search packs" aria-label="Search packs">
<div class="chips"><button id="popular" class="on">Popular</button><button id="new">New</button></div>
<div id="list"><p class="muted">Loading…</p></div>
<p class="muted">Made a start page others would like? Publish it from Sweb: Menu → Packs → Publish your own pack.</p>
</main>
<script src="sweb.js"></script>
<script>
var sort='popular',q=document.getElementById('q'),list=document.getElementById('list'),t;
function load(){
  api('/v1/packs?sort='+sort+'&q='+encodeURIComponent(q.value.trim())).then(function(r){
    list.innerHTML=r.packs.length?r.packs.map(function(p){
      var m=p.meta||{};
      return '<a class="pack" href="p.html?id='+encodeURIComponent(p.id)+'"><h2>'+esc(m.title||p.name)+'</h2><div class="muted">'+p.siteCount+' sites · '+p.followers+' following</div>'+(m.description?'<p>'+esc(m.description)+'</p>':'')+'<div class="tiles">'+p.preview.slice(0,4).map(tile).join('')+'</div></a>';
    }).join(''):'<p class="muted">No packs match yet.</p>';
  }).catch(function(){list.innerHTML='<p class="muted">The pack library is not reachable right now. Try again in a bit.</p>';});
}
q.oninput=function(){clearTimeout(t);t=setTimeout(load,250);};
['popular','new'].forEach(function(id){document.getElementById(id).onclick=function(){sort=id;document.querySelectorAll('.chips button').forEach(function(b){b.className=b.id===id?'on':'';});load();};});
load();
</script></body></html>
